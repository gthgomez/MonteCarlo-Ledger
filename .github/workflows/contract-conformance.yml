name: Contract conformance

on:
  push:
    branches: ["master", "campaign/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "historical-pin (default) or candidate-sha (exact Android commit)"
        type: choice
        options:
          - historical-pin
          - candidate-sha
        default: historical-pin
        required: true
      android_sha:
        description: "Full 40-hex Android commit SHA. Required only for target=candidate-sha."
        type: string
        required: false
        default: ""

permissions:
  contents: read

env:
  ANDROID_REPO: gthgomez/MonteCarloLedger-Android
  # Historical reference for automatic checks; never an exact-candidate fallback.
  # Both checkouts must carry matching corpora for the strict comparison.
  ANDROID_PIN_SHA: 7216e8d41994b63918c676c173cc306407ef04a9

jobs:
  # Fast, always-on path: Python against the checked-in, hash-pinned Kotlin baseline. Runs on
  # every push/PR with no cross-repo toolchain, so it must never be weakened or gated.
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e .[dev] jsonschema

      - name: Python passes the golden corpus
        run: python -m pytest tests/test_contract_conformance.py -q

      - name: Emit Python canonical results
        run: python tools/conformance/run_python.py --out build/python-results

      - name: Cross-engine comparison against the pinned Kotlin baseline
        run: |
          python tools/conformance/cross_engine.py \
            --fixtures fixtures \
            --python-dir build/python-results \
            --kotlin-dir tools/conformance/kotlin-baseline

  # Missing historical access skips the heavy job; an exact dispatch fails closed.
  live-scope:
    name: Select conformance lane
    runs-on: ubuntu-latest
    outputs:
      conformance: ${{ steps.scope.outputs.conformance }}
      ready: ${{ steps.precheck.outputs.ready }}
      lane: ${{ steps.scope.outputs.lane }}
      android_sha: ${{ steps.scope.outputs.android_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: scope
        name: Select lane and exact Android revision
        env:
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          DISPATCH_ANDROID_SHA: ${{ github.event.inputs.android_sha }}
        run: |
          set -euo pipefail
          emit() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }
          event="${GITHUB_EVENT_NAME}"
          if [ "$event" = "workflow_dispatch" ]; then
            target="${DISPATCH_TARGET:-historical-pin}"
            sha="${DISPATCH_ANDROID_SHA:-}"
            case "$target" in
              historical-pin)
                if [ -n "$sha" ]; then
                  echo "::error::target=historical-pin does not accept android_sha; select target=candidate-sha to qualify an exact Android commit."
                  exit 1
                fi
                emit lane historical
                emit android_sha "${ANDROID_PIN_SHA}"
                emit conformance true
                echo "Historical pinned lane selected: ${ANDROID_PIN_SHA}"
                ;;
              candidate-sha)
                if [[ ! "$sha" =~ ^[[:xdigit:]]{40}$ ]]; then
                  echo "::error::target=candidate-sha requires a full 40-character hexadecimal android_sha."
                  exit 1
                fi
                emit lane exact
                emit android_sha "${sha,,}"
                emit conformance true
                echo "Exact Android candidate lane selected: ${sha}"
                ;;
              *)
                echo "::error::unknown target '${target}'; expected historical-pin or candidate-sha."
                exit 1
                ;;
            esac
            exit 0
          fi

          # push / pull_request: automatic historical lane, path-gated as before.
          emit lane historical
          emit android_sha "${ANDROID_PIN_SHA}"
          if [ "$event" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.sha }}"
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            # New branch, first push, or force-push: fall back to the previous commit.
            if git rev-parse --verify -q HEAD~1 >/dev/null 2>&1; then
              base="HEAD~1"
            else
              base="HEAD"
            fi
            head="HEAD"
          fi
          changed="$(git diff --name-only "$base" "$head")"
          echo "Changed files ($base..$head):"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -Eq '^(fixtures/|schemas/|contracts/|tools/conformance/|monte_carlo_ledger/contract/|\.github/workflows/contract-conformance\.yml)'; then
            emit conformance true
          else
            emit conformance false
          fi

      - id: precheck
        name: Precondition — cross-repo access to the Android engine
        env:
          LANE: ${{ steps.scope.outputs.lane }}
          ANDROID_REPO_IS_PRIVATE: ${{ vars.ANDROID_REPO_IS_PRIVATE || 'false' }}
          ANDROID_REPO_TOKEN: ${{ secrets.ANDROID_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ "${LANE}" = "exact" ]; then
            if [ "${ANDROID_REPO_IS_PRIVATE}" = "true" ]; then
              echo "::error::The exact candidate lane cannot check out a private Android repository with its read-only workflow token."
              exit 1
            fi
            echo "Exact lane uses only the short-lived contents:read GITHUB_TOKEN; no cross-repo secret."
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "${ANDROID_REPO_IS_PRIVATE}" = "true" ] && [ -z "${ANDROID_REPO_TOKEN}" ]; then
            echo "::warning::Android repo is private and ANDROID_REPO_TOKEN is absent — conformance-live will be SKIPPED, so this run contains NO live cross-engine evidence. Set the ANDROID_REPO_TOKEN secret (read-only cross-repo) to qualify live."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Record live qualification scope
        if: always()
        env:
          LIVE: ${{ steps.scope.outputs.conformance }}
          READY: ${{ steps.precheck.outputs.ready }}
          LANE: ${{ steps.scope.outputs.lane }}
          ANDROID_SHA: ${{ steps.scope.outputs.android_sha }}
        run: |
          if [ "$LIVE" = "true" ] && [ "$READY" = "true" ]; then
            printf 'Live comparison requested: `%s` Android `%s`.\n' "$LANE" "$ANDROID_SHA" >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No live cross-engine evidence: the comparison was out of scope or could not be started.' >> "$GITHUB_STEP_SUMMARY"
          fi

  conformance-live:
    needs: live-scope
    if: needs.live-scope.outputs.conformance == 'true' && needs.live-scope.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Android toolchain + Gradle + full corpus: bound the run so a wedged daemon cannot burn the
    # default 6h budget.
    timeout-minutes: 45
    concurrency:
      # One live qualification per ref, and never cancel an in-flight verification (a cancelled run
      # is not evidence either): a newer run queues rather than replacing evidence already coming.
      group: conformance-live-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: python -m pip install --upgrade pip && pip install -e .[dev] jsonschema

      # The exact lane uses only the read-only workflow token.
      - name: Check out the exact Android candidate
        if: needs.live-scope.outputs.lane == 'exact'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANDROID_REPO }}
          ref: ${{ needs.live-scope.outputs.android_sha }}
          path: android
          token: ${{ github.token }}
          persist-credentials: false

      - name: Check out the historical pinned Android engine
        if: needs.live-scope.outputs.lane == 'historical'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ANDROID_REPO }}
          ref: ${{ needs.live-scope.outputs.android_sha }}
          path: android
          # Historical private-repo behavior is unchanged. The credential is scoped to this step.
          token: ${{ secrets.ANDROID_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Verify checked-out identities before running the Android engine
        env:
          LANE: ${{ needs.live-scope.outputs.lane }}
          EXPECTED_PYTHON_SHA: ${{ github.sha }}
          EXPECTED_ANDROID_SHA: ${{ needs.live-scope.outputs.android_sha }}
        run: |
          set -euo pipefail
          verify() {
            local observed
            observed="$(git -C "$1" rev-parse HEAD)"
            echo "$LANE $1 requested=$2 observed=$observed"
            test "$observed" = "$2"
            test -z "$(git -C "$1" status --porcelain --untracked-files=no)"
          }
          verify . "$EXPECTED_PYTHON_SHA"
          verify android "$EXPECTED_ANDROID_SHA"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # `android-actions/setup-android@v3` was deliberately DROPPED here. It shells out to
      # `sdkmanager`, which fails on cmdline-tools 16.0 with "Failed to find package 'tools'" —
      # the legacy `tools` package no longer exists, so the action can never install it. The
      # GitHub `ubuntu-latest` image already ships an Android SDK at /usr/local/lib/android/sdk
      # with ANDROID_HOME/ANDROID_SDK_ROOT exported, which is all the Gradle `ContractEmitTest`
      # JVM run needs. Do NOT reintroduce a step that invokes sdkmanager.
      - name: Locate the preinstalled Android SDK
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$sdk" ]; then
            echo "::error::No Android SDK at '$sdk' — expected the runner's preinstalled SDK (ubuntu-latest)."
            exit 1
          fi
          # Normalise both variable names for the Gradle steps below; never run sdkmanager.
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          echo "Using preinstalled Android SDK: $sdk"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Prove freshness: clear any pre-existing emitter output, regenerate the corpus, and require
      # the Android checkout to remain the exact requested commit with no tracked modifications.
      - name: Run the Kotlin contract emitter
        working-directory: android
        env:
          LANE: ${{ needs.live-scope.outputs.lane }}
        run: |
          set -euo pipefail
          rm -rf app/build/contract-results
          checks=(--tests "com.montecarlo.ledger.contract.ContractEmitTest")
          if [ "$LANE" = "exact" ]; then
            checks+=(--tests "com.montecarlo.ledger.adoption.ContractScenarioBridgeTest"
                     --tests "com.montecarlo.ledger.dashboard.ContractAdoptionDashboardTest")
          fi
          ./gradlew :app:testDebugUnitTest "${checks[@]}" --no-daemon

      - name: Re-verify emitter identity and stage fresh Kotlin results
        env:
          EXPECTED_ANDROID_SHA: ${{ needs.live-scope.outputs.android_sha }}
        run: |
          set -euo pipefail
          observed="$(git -C android rev-parse HEAD)"
          echo "Android emitter requested=${EXPECTED_ANDROID_SHA} observed=${observed}"
          test "$observed" = "$EXPECTED_ANDROID_SHA"
          test -z "$(git -C android status --porcelain --untracked-files=no)"
          rm -rf build/kotlin-live-results
          mkdir -p build/kotlin-live-results
          cp -v android/app/build/contract-results/*.json build/kotlin-live-results/
          count="$(find build/kotlin-live-results -maxdepth 1 -name '*.json' | wc -l)"
          echo "staged ${count} fresh Kotlin result files"
          test "${count}" -ge 20

      # Emit Python after the Android emitter, so candidate build steps cannot pre-seed the Python
      # results consumed by the comparison.
      - name: Emit fresh Python canonical results
        run: python tools/conformance/run_python.py --out build/python-results

      - name: Cross-engine comparison against fresh Kotlin output
        env:
          ANDROID_SHA: ${{ needs.live-scope.outputs.android_sha }}
        run: |
          set -euo pipefail
          python tools/conformance/cross_engine.py \
            --fixtures fixtures \
            --python-dir build/python-results \
            --kotlin-dir build/kotlin-live-results \
            --kotlin-sha "${ANDROID_SHA}" \
            --contract-pin android/app/src/test/resources/contract/contract-pin.json \
            --strict \
            --report build/cross-engine-live-report.md

      - name: Record lane provenance in the job summary
        if: always()
        env:
          LANE: ${{ needs.live-scope.outputs.lane }}
          REQUESTED_PYTHON_SHA: ${{ github.sha }}
          REQUESTED_ANDROID_SHA: ${{ needs.live-scope.outputs.android_sha }}
          JOB_STATUS: ${{ job.status }}
        run: |
          observed_python="$(git rev-parse HEAD 2>/dev/null || echo unavailable)"
          observed_android="$(git -C android rev-parse HEAD 2>/dev/null || echo unavailable)"
          {
            printf '## Cross-engine comparison: %s (%s)\n' "$LANE" "$JOB_STATUS"
            printf -- '- Ledger requested `%s`, observed `%s`\n' "$REQUESTED_PYTHON_SHA" "$observed_python"
            printf -- '- Android requested `%s`, observed `%s`\n' "$REQUESTED_ANDROID_SHA" "$observed_android"
            if [ -f build/cross-engine-live-report.md ]; then
              echo '- Strict comparison report attached.'
            else
              echo '- No comparison report was produced.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload live cross-engine report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cross-engine-${{ needs.live-scope.outputs.lane }}-report
          path: build/cross-engine-live-report.md
          if-no-files-found: ignore
