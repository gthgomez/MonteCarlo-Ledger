name: Web

on:
  push:
    branches: ["master"]
    paths:
      - "web/**"
      - "fixtures/**"
      - "schemas/**"
      - "monte_carlo_ledger/**"
      - "tests/**"
      - "testdata/**"
      - "pyproject.toml"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "web/**"
      - "fixtures/**"
      - "schemas/**"
      - "monte_carlo_ledger/**"
      - "tests/**"
      - "testdata/**"
      - "pyproject.toml"
      - ".github/workflows/web.yml"
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm lint

      - name: Unit + contract conformance (all 38 fixtures, valid and invalid)
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production

      - name: Set up Python for the recovery leg
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the Python CLI for the recovery leg
        working-directory: .
        run: python -m pip install -e '.[dev]'

      - name: Resolve the Python interpreter path
        id: python-path
        working-directory: .
        run: echo "path=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E against the production build
        run: pnpm exec playwright test
        env:
          NODE_ENV: production
          MC_QUALIFICATION_PYTHON: ${{ steps.python-path.outputs.path }}

      - name: Qualify recovery against a disposable libSQL file
        run: |
          export MC_QUALIFICATION_VAULT_FILE="$(mktemp -d "$RUNNER_TEMP/montecarlo-vault.XXXXXX")/vault.sqlite"
          pnpm exec playwright test e2e/qualification-recovery.spec.ts e2e/portable-settings.spec.ts \
            --project desktop --workers 1
        env:
          NODE_ENV: production
          MC_QUALIFICATION_PYTHON: ${{ steps.python-path.outputs.path }}

      - name: Upload Playwright traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: web/test-results
          if-no-files-found: ignore
